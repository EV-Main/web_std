env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  particles:
    name: Particles
    outputs:
      gen-drift_seconds: ${{ steps.run.outputs['gen-drift_seconds'] }}
      gen-drift_status: ${{ steps.run.outputs['gen-drift_status'] }}
      rust-uikit_seconds: ${{ steps.run.outputs['rust-uikit_seconds'] }}
      rust-uikit_status: ${{ steps.run.outputs['rust-uikit_status'] }}
      ts-analytics-test_seconds: ${{ steps.run.outputs['ts-analytics-test_seconds'] }}
      ts-analytics-test_status: ${{ steps.run.outputs['ts-analytics-test_status'] }}
      ts-analytics-typecheck_seconds: ${{ steps.run.outputs['ts-analytics-typecheck_seconds'] }}
      ts-analytics-typecheck_status: ${{ steps.run.outputs['ts-analytics-typecheck_status'] }}
      ts-api-test_seconds: ${{ steps.run.outputs['ts-api-test_seconds'] }}
      ts-api-test_status: ${{ steps.run.outputs['ts-api-test_status'] }}
      ts-api-typecheck_seconds: ${{ steps.run.outputs['ts-api-typecheck_seconds'] }}
      ts-api-typecheck_status: ${{ steps.run.outputs['ts-api-typecheck_status'] }}
      ts-architecture-test_seconds: ${{ steps.run.outputs['ts-architecture-test_seconds'] }}
      ts-architecture-test_status: ${{ steps.run.outputs['ts-architecture-test_status'] }}
      ts-architecture-typecheck_seconds: ${{ steps.run.outputs['ts-architecture-typecheck_seconds'] }}
      ts-architecture-typecheck_status: ${{ steps.run.outputs['ts-architecture-typecheck_status'] }}
      ts-error-monitoring-test_seconds: ${{ steps.run.outputs['ts-error-monitoring-test_seconds'] }}
      ts-error-monitoring-test_status: ${{ steps.run.outputs['ts-error-monitoring-test_status'] }}
      ts-error-monitoring-typecheck_seconds: ${{ steps.run.outputs['ts-error-monitoring-typecheck_seconds'] }}
      ts-error-monitoring-typecheck_status: ${{ steps.run.outputs['ts-error-monitoring-typecheck_status'] }}
      ts-experiments-test_seconds: ${{ steps.run.outputs['ts-experiments-test_seconds'] }}
      ts-experiments-test_status: ${{ steps.run.outputs['ts-experiments-test_status'] }}
      ts-experiments-typecheck_seconds: ${{ steps.run.outputs['ts-experiments-typecheck_seconds'] }}
      ts-experiments-typecheck_status: ${{ steps.run.outputs['ts-experiments-typecheck_status'] }}
      ts-figma-render-test_seconds: ${{ steps.run.outputs['ts-figma-render-test_seconds'] }}
      ts-figma-render-test_status: ${{ steps.run.outputs['ts-figma-render-test_status'] }}
      ts-figma-render-typecheck_seconds: ${{ steps.run.outputs['ts-figma-render-typecheck_seconds'] }}
      ts-figma-render-typecheck_status: ${{ steps.run.outputs['ts-figma-render-typecheck_status'] }}
      ts-i18n-test_seconds: ${{ steps.run.outputs['ts-i18n-test_seconds'] }}
      ts-i18n-test_status: ${{ steps.run.outputs['ts-i18n-test_status'] }}
      ts-i18n-typecheck_seconds: ${{ steps.run.outputs['ts-i18n-typecheck_seconds'] }}
      ts-i18n-typecheck_status: ${{ steps.run.outputs['ts-i18n-typecheck_status'] }}
      ts-keymap-test_seconds: ${{ steps.run.outputs['ts-keymap-test_seconds'] }}
      ts-keymap-test_status: ${{ steps.run.outputs['ts-keymap-test_status'] }}
      ts-keymap-typecheck_seconds: ${{ steps.run.outputs['ts-keymap-typecheck_seconds'] }}
      ts-keymap-typecheck_status: ${{ steps.run.outputs['ts-keymap-typecheck_status'] }}
      ts-marketing-test_seconds: ${{ steps.run.outputs['ts-marketing-test_seconds'] }}
      ts-marketing-test_status: ${{ steps.run.outputs['ts-marketing-test_status'] }}
      ts-marketing-typecheck_seconds: ${{ steps.run.outputs['ts-marketing-typecheck_seconds'] }}
      ts-marketing-typecheck_status: ${{ steps.run.outputs['ts-marketing-typecheck_status'] }}
      ts-mfe-test_seconds: ${{ steps.run.outputs['ts-mfe-test_seconds'] }}
      ts-mfe-test_status: ${{ steps.run.outputs['ts-mfe-test_status'] }}
      ts-mfe-typecheck_seconds: ${{ steps.run.outputs['ts-mfe-typecheck_seconds'] }}
      ts-mfe-typecheck_status: ${{ steps.run.outputs['ts-mfe-typecheck_status'] }}
      ts-settings-test_seconds: ${{ steps.run.outputs['ts-settings-test_seconds'] }}
      ts-settings-test_status: ${{ steps.run.outputs['ts-settings-test_status'] }}
      ts-settings-typecheck_seconds: ${{ steps.run.outputs['ts-settings-typecheck_seconds'] }}
      ts-settings-typecheck_status: ${{ steps.run.outputs['ts-settings-typecheck_status'] }}
      ts-uikit-test_seconds: ${{ steps.run.outputs['ts-uikit-test_seconds'] }}
      ts-uikit-test_status: ${{ steps.run.outputs['ts-uikit-test_status'] }}
      ts-uikit-typecheck_seconds: ${{ steps.run.outputs['ts-uikit-typecheck_seconds'] }}
      ts-uikit-typecheck_status: ${{ steps.run.outputs['ts-uikit-typecheck_status'] }}
      ts-views-test_seconds: ${{ steps.run.outputs['ts-views-test_seconds'] }}
      ts-views-test_status: ${{ steps.run.outputs['ts-views-test_status'] }}
      ts-views-typecheck_seconds: ${{ steps.run.outputs['ts-views-typecheck_seconds'] }}
      ts-views-typecheck_status: ${{ steps.run.outputs['ts-views-typecheck_status'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore particles' cache
        uses: actions/cache/restore@v5
        with:
          key: particles-errors-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particles-errors-${{ runner.os }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Particles' cache
        uses: actions/cache@v5
        with:
          key: particles-errors-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particles-errors-${{ runner.os }}-
      - id: run
        run: nix run .#test -- --severity errors --serial ts-analytics-typecheck ts-analytics-test ts-api-typecheck ts-api-test ts-architecture-typecheck ts-architecture-test ts-error-monitoring-typecheck ts-error-monitoring-test ts-experiments-typecheck ts-experiments-test ts-figma-render-typecheck ts-figma-render-test ts-i18n-typecheck ts-i18n-test ts-keymap-typecheck ts-keymap-test ts-marketing-typecheck ts-marketing-test ts-mfe-typecheck ts-mfe-test ts-settings-typecheck ts-settings-test ts-uikit-typecheck ts-uikit-test ts-views-typecheck ts-views-test rust-uikit gen-drift
    timeout-minutes: 90
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  report:
    if: always() && github.ref_name == github.event.repository.default_branch
    name: Report
    needs:
      - particles
      - rust-tests
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PARTICLES: '[{"generic":false,"name":"rust-tests"},{"generic":true,"name":"ts-analytics-typecheck"},{"generic":true,"name":"ts-analytics-test"},{"generic":true,"name":"ts-api-typecheck"},{"generic":true,"name":"ts-api-test"},{"generic":true,"name":"ts-architecture-typecheck"},{"generic":true,"name":"ts-architecture-test"},{"generic":true,"name":"ts-error-monitoring-typecheck"},{"generic":true,"name":"ts-error-monitoring-test"},{"generic":true,"name":"ts-experiments-typecheck"},{"generic":true,"name":"ts-experiments-test"},{"generic":true,"name":"ts-figma-render-typecheck"},{"generic":true,"name":"ts-figma-render-test"},{"generic":true,"name":"ts-i18n-typecheck"},{"generic":true,"name":"ts-i18n-test"},{"generic":true,"name":"ts-keymap-typecheck"},{"generic":true,"name":"ts-keymap-test"},{"generic":true,"name":"ts-marketing-typecheck"},{"generic":true,"name":"ts-marketing-test"},{"generic":true,"name":"ts-mfe-typecheck"},{"generic":true,"name":"ts-mfe-test"},{"generic":true,"name":"ts-settings-typecheck"},{"generic":true,"name":"ts-settings-test"},{"generic":true,"name":"ts-uikit-typecheck"},{"generic":true,"name":"ts-uikit-test"},{"generic":true,"name":"ts-views-typecheck"},{"generic":true,"name":"ts-views-test"},{"generic":true,"name":"rust-uikit"},{"generic":true,"name":"gen-drift"}]'
        name: Tally the particles
        run: |
          read -r failed total seconds incomplete < <(jq -rn --argjson needs "$NEEDS" --argjson spec "$PARTICLES" '
            def secs: if . == null or . == "" then 0 else tonumber end;
            [ $spec[] | . as $p
              | if $p.generic
                then $needs.particles as $j | { ok: ($j.outputs[$p.name + "_status"] == "ok"), t: ($j.outputs[$p.name + "_seconds"] | secs), r: $j.result }
                else $needs[$p.name] as $j | { ok: ($j.result == "success"), t: ($j.outputs.seconds | secs), r: $j.result } end ]
            | "\(map(select(.ok | not)) | length) \(length) \(map(.t) | add) \(map(select(.r == "skipped" or .r == "cancelled")) | length)"')
          if [ "$incomplete" != 0 ]; then
            echo "::notice::a particle's job was skipped or cancelled: the badge keeps its last complete run"
            exit 0
          fi
          time="$((seconds / 60))m $((seconds % 60))s"
          if [ "$failed" = 0 ]; then msg="✓ $time" color=brightgreen; else msg="✗ $failed/$total · $time" color=red; fi
          { echo "BADGE_MESSAGE=$msg"; echo "BADGE_COLOR=$color"; } >> "$GITHUB_ENV"
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-errors.json][content]={\"schemaVersion\": 1, \"label\": \"errors\", \"message\": \"$BADGE_MESSAGE\", \"color\": \"$BADGE_COLOR\", \"labelColor\": \"420d09\"}"
  rust-tests:
    if: needs.pre_ci.outputs.continue
    name: Rust ${{matrix.rust}}
    needs: pre_ci
    outputs:
      seconds: ${{ steps.particle.outputs.seconds }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
      - name: Install mold
        uses: rui314/setup-mold@v1
      - if: github.ref == 'refs/heads/release'
        name: Set RUSTFLAGS for release branch
        run: echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV
      - if: matrix.rust == 'nightly'
        name: Enable type layout randomization
        run: |
          printf '#!/bin/sh\nexec "$@" -Zrandomize-layout --cfg=exhaustive\n' > /tmp/randomize-layout.sh
          chmod +x /tmp/randomize-layout.sh
          echo RUSTC_WORKSPACE_WRAPPER=/tmp/randomize-layout.sh >> $GITHUB_ENV
      - name: Download modified by pre-ci Cargo.toml files
        uses: actions/download-artifact@v7
        with:
          name: modified-cargo-files
      - run: cargo update
      - uses: Swatinem/rust-cache@v2
      - run: echo "T_PARTICLE=$(date +%s)" >> "$GITHUB_ENV"
      - run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - run: cargo test --workspace --no-run
      - run: echo "T1=$(date +%s)" >> $GITHUB_ENV
      - run: cargo check --workspace --all-targets
      - run: echo "T2=$(date +%s)" >> $GITHUB_ENV
      - run: cargo test --workspace
      - run: echo "T3=$(date +%s)" >> $GITHUB_ENV
      - id: particle
        if: always() && (matrix.rust == 'nightly')
        run: 'echo "seconds=$((T_PARTICLE ? $(date +%s) - T_PARTICLE : 0))" >> "$GITHUB_OUTPUT"'
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: github.ref_name == github.event.repository.default_branch && matrix.rust == 'nightly'
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: github.ref_name == github.event.repository.default_branch && matrix.rust == 'nightly'
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-build.json][content]={\"schemaVersion\": 1, \"label\": \"build\", \"message\": \"$(((T1-T0)/60))m $(((T1-T0)%60))s\", \"color\": \"lightblue\"}" \
          -f "files[$PNAME-test.json][content]={\"schemaVersion\": 1, \"label\": \"test\", \"message\": \"$(((T3-T2)/60))m $(((T3-T2)%60))s\", \"color\": \"lightblue\"}"
    strategy:
      fail-fast: false
      matrix:
        rust:
          - nightly
          - nightly-2026-05-12
    timeout-minutes: 45
name: Errors
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
