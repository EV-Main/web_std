# Thin virtual workspace. The crate's sources live in `rust/` (mirroring `ts/`),
# but the shared CI and tooling drive cargo from the repo root, so the workspace
# anchors the crate here. See docs/ARCHITECTURE.md.
[workspace]
resolver = "3"
members = ["rust", "rust/classes", "rust/gen", "rust/macros", "rust/uikit-viewer"]

[workspace.lints.rust]
stable_features = "allow"
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.lints.clippy]
if_not_else = "warn"
integer_division = "warn"

[workspace.dependencies]
aide = "0.16.0-alpha.4"
async-trait = "0.1.89"
axum = "0.8"
dioxus = { version = "0.7", default-features = false }
dioxus-liveview = "0.7"
dioxus-ssr = "0.7"
ev_lib = { path = "rust", version = "0.34.0" }
ev_lib_classes = { path = "rust/classes", version = "0.20.0" }
ev_lib_macros = { path = "rust/macros", version = "0.1.0" }
form_urlencoded = "1"
insta = "1"
jiff = "0.2"
leptos = { version = "0.8", default-features = false }
leptos_meta = "0.8"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
reactive_graph = "0.2.14"
schemars = "1"
scraper = "0.24"
serde = "1"
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
syn = "2"
tailwind_fuse = "0.3"
tempfile = "3"
thiserror = "2"
tokio = "1"
tower = "0.5"
tracing-subscriber = { version = "0.3", default-features = false }
ts-rs = "12"
uuid = "1"

[workspace.package]
repository = "https://github.com/EV-Main/web_std"

# smaller target/: trim debuginfo (deps need none), keep line tables for backtraces
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
